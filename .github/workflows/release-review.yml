name: Release review quality
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit firefox
      - run: npm test
      - run: npm run build
      - name: Test the built website in all three engines
        run: |
          mkdir -p work
          python3 -m http.server 18765 --bind 127.0.0.1 --directory dist > work/server.log 2>&1 &
          REVIEW_SERVER_PID=$!
          trap 'kill "$REVIEW_SERVER_PID"' EXIT
          node scripts/browser-qa.mjs
          node scripts/interaction-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-quality-evidence
          path: work/browser-qa/
          retention-days: 14
