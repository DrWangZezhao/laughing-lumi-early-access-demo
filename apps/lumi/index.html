<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#dbe4ff" />
<title>Laughing Lumi</title>
<link rel="icon" href="./art/logo.png" />
</head>
<body>
<div id="app">
  <div id="root">
    <header id="topbar">
      <div class="brand">
        <img class="logo" src="./art/logo.png" alt="Laughing Lumi logo" />
        <img class="letters" src="./art/letters.png" alt="Laughing Lumi" />
      </div>
      <div id="viewButtons" role="tablist">
        <button id="playButton" class="seg on" role="tab" aria-selected="true">PLAY</button>
        <button id="lumiButton" class="seg" role="tab" aria-selected="false">LUMI</button>
      </div>
      <div class="right">
        <button id="scoresButton" class="sq tint" aria-label="Scores"><img src="./art/reward.svg" alt="" /></button>
        <button id="settingsButton" class="sq tint" aria-label="Settings"><img src="./art/gear.svg" alt="" /></button>
      </div>
    </header>

    <main id="frame">
      <div id="stage" style="background-image:url(./art/winter-scene.jpg)">
        <img id="character" src="./art/lumi-face.png" alt="Lumi" />
      </div>

      <!-- ActivityWindow (PLAY) -->
      <section id="activityWindow" class="view">
        <div id="activityButtons" class="panel">
          <button class="act" data-activity="0" style="--fill:#FF9500;--stroke:#FFBF66;--c:#d09100">
            <span class="base"><img src="./art/icon-move.svg" alt="" /><b>MOVE</b></span>
            <span class="txt">Show Lumi how to greet new friends by waving</span>
          </button>
          <button class="act" data-activity="1" style="--fill:#57C5CD;--stroke:#9ADCE1;--c:#59b3b7">
            <span class="base"><img src="./art/icon-listen.svg" alt="" /><b>LISTEN</b></span>
            <span class="txt">Listen to what Lumi knows about snow</span>
          </button>
          <button class="act" data-activity="2" style="--fill:#A641CD;--stroke:#CA8DE1;--c:#9e42b7">
            <span class="base"><img src="./art/icon-create.svg" alt="" /><b>CREATE</b></span>
            <span class="txt">Draw a snowflake with Lumi</span>
          </button>
          <button class="act" data-activity="3" style="--fill:#B7D700;--stroke:#D7EB66;--c:#aabd00">
            <span class="base"><img src="./art/icon-do.svg" alt="" /><b>DO</b></span>
            <span class="txt">Take Lumi outdoors</span>
          </button>
        </div>
        <div id="activityInstruction" class="panel hidden">
          <button id="instructionButton" class="instr">
            <span class="base"><img src="./art/show.svg" alt="" /><b>SHOW</b></span>
            <span class="txt">Activity instruction text. Show Lumi how to greet new friends by waving</span>
          </button>
          <button id="startActivityButton" class="round tint" aria-label="Start activity"><img src="./art/show.svg" alt="" /></button>
        </div>
      </section>

      <!-- AICompanionWindow (LUMI) -->
      <section id="companionWindow" class="view hidden">
        <div id="debugBG" class="hidden"><div id="debugTranscript"></div></div>
        <div id="bottomInteractionButtons">
          <button id="typeButton" class="type tint"><img src="./art/keyboard.svg" alt="" /><span>TYPE</span></button>
          <button id="talkButton" class="talk tint"><img src="./art/mic.svg" alt="" /><span>TALK</span></button>
        </div>
        <div id="bottomInteractionMicrophone" class="panel hidden">
          <div class="listening">LUMI IS LISTENING...</div>
          <button id="stopButton" class="round tint" aria-label="Stop talking"><img src="./art/mic.svg" alt="" /></button>
          <div class="stoptext">STOP TALKING</div>
        </div>
      </section>
    </main>
  </div>

  <form id="debugInput" autocomplete="off">
    <input id="debugText" type="text" enterkeyhint="send" placeholder="Type a message to Lumi" />
    <button type="submit">Send</button>
  </form>
  <div id="debugHint" class="hidden"></div>
</div>
<script type="module" src="./src/main.ts"></script>
</body>
</html>
